  # Sekcja związana ze sklepem.
  shop:
    # Sekcja związana z komendami:
    command:
      # Główna komenda sklepu.
      main-command: sklep
      # Lista aliasów głównej komendy.
      aliases:
      - market
      - shop
      - ah
    item-value-lore:
      enabled: true
      normal-format: '&a$%sell_price%'
      boosted-format: '&7(x%booster_multiplier%) &a$%sell_price%'
      refresh-interval-ticks: 40
    # Sekcja związana z menu sklepu.
    main-menu:
      # Opisuje, co ile sekund można ponownie użyć głównej komendy.
      command-cooldown: 2
      # Rodzaj ekwipunku, który będzie zastosowany dla wszystkich menu sklepu.
      inventory-type: CHEST
      # Rozmiar głównego menu.
      size: 45
      # Ścieżka, z której plugin będzie pobierał menu dla sekcji sklepu.
      menus-loading-path: resources/GUIs/shop
      # Ustawienia sekcji sklepu.
      # Jest to też lista plików, które plugin ma wczytać.
      shop-sections:
        # Przykładowa sekcja sklepu.
        blocks:
          # Nazwa sekcji wyświetlana w głównym menu.
          display-title: "&e&lʙʟᴏᴋɪ"
          # Przedmiot reprezentujący sekcje.
          material: GRASS_BLOCK
          # Miejsce, w głównym menu, na którym będzie się znajdować ikona sekcji.
          slot: 20
          # Nazwa pliku, którego plugin będzie szukał i podpinał do sekcji, aby po kliknięciu, w sekcje otworzyło się kolejne menu.
          file: blocks.yml
        food:
          display-title: "&6&lᴊᴇᴅᴢᴇɴɪᴇ"
          material: COOKED_BEEF
          slot: 21
          file: food.yml
        minerals:
          display-title: "&b&lʀᴜᴅʏ"
          material: DIAMOND
          slot: 22
          file: minerals.yml
        mob_drops:
          display-title: "&6&lᴍᴏʙᴏᴡᴇ ᴅʀᴏᴘʏ"
          material: GUNPOWDER
          slot: 23
          file: mob_drops.yml
        spawners:
          display-title: "&6&lsᴘᴀᴡɴᴇʀʏ"
          material: SPAWNER
          slot: 24
          file: spawners.yml
        info:
          display-title: "%player_name%"
          material: '%player_head%'
          slot: 36
          file: ''
          lore:
          - ''
          - '&fBalans: &a%oneblock_currency_money%$'
        search:
          display-title: "&b&lWyszukaj przedmiot"
          material: SPYGLASS
          slot: 44
          file: ''
          lore:
          - ''
          - '&7Kliknij, aby wpisać nazwę'
          - '&7lub poczatek nazwy przedmiotu.'
          - ''
          - '&eKliknij, aby wyszukać!'
          action: SEARCH
      # Możliwość ustawienia specyficznych akcji po kliknięciu, na dany przedmiot w sekcji.
      # Wspieranymi akcjami są: BUY, BUY_MOST, SELL, SELL_ALL.
      # Wspieranymi kliknięciami są: LEFT, SHIFT_LEFT, RIGHT, SHIFT_RIGHT.
      click-mappings:
        BUY: LEFT
        SELL: RIGHT
        SELL_ALL: SHIFT_RIGHT
      # Ustawienia dotyczące zniżek sklepowych.
      discounts:
        # Determinuje, czy zniżki powinny byc włączone
        enabled: true
        # Określa, czy włączyć możliwość mnożenia zysku ze sprzedaży przez graczy z aktywnym boosterem, bądź bonusem od kraju
        enable-sell-multipliers: true
        # Wygląd zniżki na przedmiocie
        discount-format: "&m&a$%item_cost% &a$%discount_item_cost%"
        # Wygląd ceny sprzedaży z boosterem
        sell-format: "&c&m$%normal_sell_income% &a$%boosted_sell_income%"
      # Sekcja dotycząca przedmiotów w sekcji.
      items:
        item-lore:
        - "&aLeft Click: Kup: &a$%item_cost%"
        - "&6Right Click: Sprzedaj: %sell-format%"
        - "&bShift + Right Click: Sell All"
        # Określa, czy wartość przedmiotu ma być wyświetlana w jego lore.
        value-in-item-lore: true
        # Lista menu dotyczących różnych przypadków po kliknięciu, na przedmiot.
        items-menu:
          # Menu kupna przedmiotu.
          # Dostępnymi akcjami do użycia są:
          # ADD(1/16/32/64...) - dodaje wybrana ilość przedmiotów do kupna.
