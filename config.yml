    # Sekcja ustawień dotycząca npc.
    OlekNpc:
      # Stwierdza, którego pluginu użyć do stworzenia npc.
      # Wspieranymi opcjami są:
      # Citizens2 - plugin spróbuje stworzyć npc za pomocą pluginu Citizens2.
      # Selfmaking — plugin samodzielnie spróbuje stworzyć npc bez pomocy innych pluginów.
      # Automatic - plugin sam wybiera lepszą opcję, w wypadku, gdyby np. nie udało mu się stworzyć npc z użyciem Citizens2.
      npc-creation: automatic
      # sekcja dotycząca podstawowego wyglądu npc.
      display:
        display-name: '&b&lOlek'
        # Linie tekstu npc, które będą wyświetlane nad nazwą npc w kolejności od najwyższej linii do najniższej.
        npc-lines:
          # tekst w line1 oraz w line12 ma być wyśrodkowany.
          line1: '&fGłówne centrum rozwojowe, które daje ci najwięcej.'
          line2: '&7-----------------------------------------------------'
          line3: '&fWykonuj &bmisje rozwojowe&f, aby zdobywać punkty rozwojowe, których'
          line4: '&fmożesz użyć do zakupu przedmiotów w sklepie państwowym lub do ulepszeń kraju.'
          line5: '&fWykonuj &amisje codzienne&f, aby zdobywać klucze do krat i kasę.'
          line6: '&fWykonuj &5questy playtime &foraz &emisje specjalne, by zdobywać najlepsze nagrody.'
          line7: '&7-----------------------------------------------------'
          line8: '&fRozwijaj poziom wyspy, aby odblokowywać nowe &bmisje rozwojowe&f.'
          line9: '&fUkończ pierwszy poradnik, w celu odblokowania nowych rzeczy i'
          line10: '&fukończaj kolejne poradniki dla niewielkich nagród i nowych misji'
          line11: '&7----------------------------------------------------'
          line12: '&7(Kliknij, aby otworzyć główne menu)'
        # Postać, jaką ma być npc.
        mob-type: villager
        # Czy mob powinien patrzeć się na gracza?
        look-at-player: true
        # Określa, czy mob jest odporny na wszelkie obrażenia, czy nie.
        invincible: true
        # Ustaw, czy mob powinien zachować normalną fizykę, czy w ogóle nie spadać.
        floating: true
        # Dystans npc od środka wyspy gracza.
        distance: 10
      # Ustawienie dotyczące akcji, jakie będzie wykonywał osadnik
      actions:
        # Determinuje w jaki sposób interaktować z osadnikiem.
        # Wspierane opcje to: Left click, Right click oraz any.
        click-type: any
        # Komenda, która będzie stosowana po kliknięciu npc.
        # Możesz wpisać więcej niż jedną komendę.
        command-on-click:
        - ob menu %player%
        # Czas w sekundach, pomiędzy następnymi kliknięciami na npc.
        cooldown: 2
    # Sekcja ustawień dotycząca bossa.
    bossOlina:
      boss-creation: selfmaking
      # Liczba serduszek bossa.
      # 1000 = 500 pełnych serc.
      health: 1000
      # Podstawowe obrażenia zadawane przez bossa.
      damage: 10
      # Prędkość poruszania się bossa.
      # Domyślny gracz ma około 0.1.
      movement-speed: 0.25
      # Sekcja zawierające ustawienia wyglądu funkcji bossa.
      display:
        # Nazwa wyświetlana nad bossem.
        name: "&d&lOlina"
        name-display: BELOW_NAME
        # Typ mob reprezentującego bossa.
        # Przykłady:
        # ZOMBIE
        # SKELETON
        # WITCH
        # EVOKER
        # ENDERMAN
        mob-type: ZOMBIE
        # Sposób wyświetlania zdrowia.
        # BOSSBAR
        # BELOW_NAME
        # BOTH
        health-display: BELOW_NAME
        # Nie działa w przypadku ustawienia tylko below_name.
        # Kolor boss bara.
        health-format: "&c%boss_hearts%❤︎"
        bossbar-color: PURPLE
        # Nie działa w przypadku ustawienia tylko below_name.
        # Styl boss bara.
        bossbar-style: SEGMENTED_10
        # Wiadomości wypowiadane przez bossa.
        messages:
          - "&dOlina: &fWitaj podróżniku..."
          - "&dOlina: &fPokaż swoją siłę!"
          - "&dOlina: &fNigdy mnie nie pokonasz!"
          - "&dOlina: &fTo dopiero początek..."
      # Sekcja związana z umiejętnościami bossa.
      skills:
        # Zwykły atak wręcz.
        punch:
          enabled: true
          damage-multiplier: 1.0
        # Odrzuca pobliskich graczy.
        knockback:
          enabled: true
          cooldown: 15
          radius: 5
          power: 2
        # Przywołuje błyskawicę.
        lightning:
          enabled: true
          cooldown: 20
          damage: 6
        # Leczenie bossa.
        heal:
          enabled: true
          cooldown: 30
          amount: 50
        # Przywołuje pomocników.
        summon-minions:
          enabled: true
          cooldown: 40
          mob: skeleton
          amount: 3
      # Sekcja dotycząca form bossa.
      forms:
        # Forma początkowa.
        normal:
          activate-health: 1000
          health-multiplier: 1.0
          damage-multiplier: 1.0
          speed-multiplier: 1.0
          skill-damage-multiplier: 1.0
          message: "&dOlina: &fNie wyglądasz groźnie."

        # Aktywuje się poniżej 75% HP.
        angry:
          activate-health: 750
          health-multiplier: 1.0
          damage-multiplier: 1.3
          speed-multiplier: 1.2
          skill-damage-multiplier: 1.1
          message: "&dOlina: &cZaczynasz mnie denerwować!"
          additional-skills:
            disarm:
              enabled: true
              cooldown: 30
              stun: 1
        # Aktywuje się poniżej 50% HP.
        enraged:
          activate-health: 500
          health-multiplier: 1.0
          damage-multiplier: 1.6
          speed-multiplier: 1.4
          skill-damage-multiplier: 1.2
          message: "&dOlina: &4Poczuj mój gniew!"
          additional-skills:
            # Wysyła pociski w postaci particle, które automatycznie lecą w stronę dwóch najbliższych graczy.
            # Particle ma się dynamicznie przemieszczać w stronę stale aktualizowanej pozycji gracza zgodnie z prędkością podaną poniżej.
            # W momencie dotknięcia particle wybucha na graczu i znika, w przypadku gdy pocisk nie zdąży dolecieć do gracza, po prostu znika.
            homing:
              enabled: true
              cooldown: 60
              quantity: 2
              damage: 8
              missile-speed: 0.15
              lifetime: 15
        # Aktywuje się poniżej 25% HP.
        final:
          activate-health: 250
          health-multiplier: 1.0
          damage-multiplier: 2.0
          speed-multiplier: 1.2
          skill-damage-multiplier: 1.4
          message: "&dOlina: &5Nie odejdę sama!"
          additional-skills:
            extreme-override:
              enabled: true
              cooldown: one-use
              area-damage: 5
              area-knowback: 7
              area-stun: 1.5
              sub-abilities:
                strength-boost:
                  lenght: 10
                  multiplier: 1.3
                minions-bow-damage-boost:
                  lenght: 120
                  multiplier: 1.5
                minions-gear-up:
                  lenght: infinite
                  armor-pieces:
                  - iron_helmet
                  - iron_chestplate
                  - iron_leggings
                  - iron_boots
                boss-gear-up:
                  lenght: infinite
                  armor-pieces:
                  - diamond_helmet
                  - diamond_chestplate
                  - diamond_leggings
                  - diamond_boots
                  - wood_sword
            # Losuje enchant, który będzie nakładany na zbroję lub miecz oraz na wyposażenie minion.
            # Enchant ma być zapisany na walkę, czyli nawet gdy respire się nowe miniony i zostanie nałożona na nie wyposażenie, to ma ono mieć aktywne enchanty.
            # Poszczególne enchanty mają być nakładane na odpowiednie wyposażenie.
            random-buff:
              enabled: true
              cooldown: 45
              enchants:
                - protection(I-III)
                - unbreaking(I-II)
                - sharpness(I-III)
                - power(I-III)
                - flame
                - fire_aspect(I-II)
      # Sekcja dotycząca ogólnych ustawień.
      settings:
        # Sekcja ogólnych ustawień związanych z bossem.
        boss:
          # Świat, w którym ma się respić boss.
          spawn-world: OneBlockLobby
          # Dokładne kordy, na których ma się respić boss.
          spawn-cords:
            # Wymiar X na koordynatach.
            X: 53
            # Wymiar Y na koordynatach.
            Y: 53
            # Wymiar Z na koordynatach.
            Z: 32
          # Czas w minutach, po których boss ma zniknąć.
          lifetime: 20
          # Godzina, określająca, kiedy w dniu ma nastąpić pierwszy spawn bossa.
          first-spawn-time: 00:00
          # Czas, po którym ma się ponownie zrespić boss.
          # Dla przykładu, gdy respawn time wynosi 1h, a first spawn time to 00:00 to boss będzie się respił o 1:00, 2:00, 3:00 itd.
          respawn-time: 1h
          # Czas w minutach odliczający nadejście bossa.
          # To oznacza, że 15 min przed spawnem lub innym ustawionym czasem bossa plugin wyśle broadcast.
          # Wiadomości są konfigurowalne w messages.yml
          countdowns:
          - 15
          - 5
          - 1
        # Sekcja ustawień ogólnych związanych z hologramem bossa.
        # Świat i kordy są takie same jak te, co zostały ustawione dla bossa.
        boss-hologram:
          enabled: true
          hologram-creation: Decentholograms
          offset:
            X: 0
            Y: 0
            Z: 0
          lore:
          - "            &b&lOlina &fponownie się wzniesie za:"
          - "              &b%boss_respawn_remaining_time%"
          # Warunek, określający, kiedy ma być wyświetlany hologram.
          # W tym przypadku oznacza to, że hologram ma być wyświetlany tylko wtedy gdy bossa nie ma na świecie.
          display-condition: '%boss_health% = 0'
          # To ustawienie definiuje, jak szybko mają się aktualizować placeholdery w hologramie.
          # -1 oznacza tak szybko, jak to jest możliwe.
          placeholders-update-interval: -1
      # Sekcja ustawień dotycząca nagród z bossa.
      # Komendy wykonywane przez konsolę serwera — %player% zostanie podmienione na nick gracza.
      rewards:
        money:
          display-name: "&a%amount% monet"
          command: "currency money give %player% %amount%"
          amounts:
            rank-1: [25000, 40000, 55000]
            rank-2: [15000, 25000]
            rank-3: [10000, 18000]
            participation: [5000, 8000]
          weight: 100
        boss-currency:
          display-name: "&d%amount% waluty bossa"
          command: "currency boss give %player% %amount%"
          amounts:
            rank-1: [3, 5, 8]
            rank-2: [2, 4]
            rank-3: [1, 3]
          weight: 35
        sell-booster-player:
          display-name: "&eBooster sprzedaży (&f%amount%x &ena &f%duration%&e)"
          command: "booster give %player% sell_boost player %duration% %amount%"
          durations: ["15m", "30m"]
          amounts: [1.25, 1.5, 2.0]
          weight: 25
        sell-booster-global:
          display-name: "&6&lGlobalny booster sprzedaży (&f%amount%x &ena &f%duration%&6&l)"
          command: "booster give %player% sell_boost global %duration% %amount%"
          durations: ["15m"]
          amounts: [1.5, 2.0]
          weight: 4
        crate-key:
          display-name: "&5%amount%x Klucz do kraty bossa"
          command: "crates key give %player% boss_key %amount%"
          amounts: [1, 2]
          weight: 12
        spawner:
          display-name: "&6Spawner &f%mob%"
          type: item
          mob-types: [chicken, pig, cow]
          weight: 8
        enchanted-weapon:
          display-name: "&b%material% &7(%enchants%)"
          type: item
          materials: [DIAMOND_PICKAXE, DIAMOND_SWORD, NETHERITE_PICKAXE, NETHERITE_SWORD]
          enchants:
            - "efficiency:4-6"
            - "unbreaking:3"
            - "sharpness:4-6"
            - "looting:2-3"
            - "fortune:3"
            - "mending:1"
          weight: 3
      top-damagers:
        minimum-damage-percent: 10
        ranks:
          "1":
            max-rewards: 3
            reward-pool: [money, boss-currency, sell-booster-player, sell-booster-global, crate-key, spawner, enchanted-weapon]
          "2":
            max-rewards: 2
            reward-pool: [money, boss-currency, sell-booster-player, crate-key, spawner, enchanted-weapon]
          "3":
            max-rewards: 2
            reward-pool: [money, boss-currency, sell-booster-player, crate-key, spawner]
          participation:
            max-rewards: 1
            reward-pool: [money, sell-booster-player]
        defeat-message:
          header:
            - ""
            - "&d&l✦ &5&lOlina została pokonana! &d&l✦"
            - "&7Najlepsi wojownicy:"
          rank-line: "&6&l#{rank} &b%player% &7— &c%damage% &7obrażeń (&e%damage_percent%%&7)"
          reward-line: "  &8» &a%reward_name%"
          footer:
            - ""
            - "&7Boss wzniesie się ponownie za: &b%boss_respawn_remaining_time%"
            - ""
    # Sekcja związana z ustawieniami rozdań kluczy.
    keys-rewards:
      display:
        display-text: "&fRozdania kluczy codziennie o &b&l9:00&f, &b&l11:00 &foraz o &b&l13:00&f"
        display-type: BOSSBAR
        bossbar-color: BLUE
        # Nie działa w przypadku ustawienia below_name.
        bossbar-style: SEGMENTED_10
      actions:
        rewards:
          keys:
            commands:
            - crates key give %player% rare_key 1
            - crates key give %player% epic_key 1
            messages:
            - "&aOtrzymałeś 1x rzadki klucz!"
            - "&aOtrzymałeś 1x epicki klucz!"
            effects:
