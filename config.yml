# Plik konfiguracyjny pluginu.
# Porada: użyj sprawdzacza składni YAML, aby mieć pewność, że format pliku jest poprawny.
# Wbudowane Placeholdery w pluginie, których możesz użyć:
#
#               %island_name% - Zwraca nazwę stworzonej przez gracza wyspy.
#               %current_island_level% - Zwraca wartość aktualnego poziomu wyspy.
#               %next_island_level% - Zwraca wartość następnego poziomu wyspy do zdobycia.
#               %max_island_level% - Zwraca maksymalny poziom, jaki wyspa może osiągnąć.
#               %current_level_name% - Zwraca nazwę aktualnego poziomu wyspy.
#               %next_level_name% - Zwraca nazwę następnego poziomu wyspy.
#               %blocks_required_for_level% - Zwraca liczbę bloków wymaganych na odblokowanie następnego poziomu.
#               %blocks_required_for_level_percentage% - Zwraca liczbę bloków wymaganych na odblokowanie następnego poziomu w procentach.
#               %current_level_reward_name% - Zwraca nazwę nagrody za aktualny poziom wyspy.
#               %next_level_reward_name% - Zwraca nazwę nagrody za odblokowanie następnego poziomu wyspy.
#               %giveaway_time_remaining% - Zwraca czas pozostały do kolejnego rozdania nagród
#               %boss_health% - Zwraca aktualną ilość punktów zdrowia bossa.
#               %boss_max_health% - Zwraca wartość maksymalnej ilości punktów zdrowia bossa.
#               %boss_hearts% - Zwraca aktualną wartość serduszek bossa.
#               %boss_max_hearts% - Zwraca maksymalną wartość serduszek bossa.
#               %boss_spawn_times% - Zwraca listę godzin, w których respi się boss.
#               %boss_respawn_remaining_time% - Zwraca pozostały czas do kolejnego spawnu bossa w formacie h: mm: ss.
#               %booster_multiplier% - Zwraca wartość mnożnika boostera.
#               %booster_time% - Zwraca czas działania boostera.
#
#               %oneblock_island_name% - Zwraca nazwę wyspy gracza.
#               %oneblock_island_country% - Zwraca wybrany kraj wyspy.
#               %oneblock_island_rank% - Zwraca rangę wyspy.
#               %oneblock_current_island_level% - Zwraca aktualny poziom wyspy.
#               %oneblock_blocks_required_for_level% - Zwraca liczbę bloków wymaganych do następnego poziomu.
#               %oneblock_blocks_required_for_level_percentage% - Zwraca postęp w procentach do następnego poziomu.
#               %oneblock_island_currency_money% - Zwraca łączny balans wyspy.
#               %oneblock_island_activity_points% - Zwraca łączną liczbę punktów aktywności wszystkich graczy wyspy.
#               %oneblock_island_kills% - Zwraca liczbę zabójstw wyspy.
#               %oneblock_island_deaths% - Zwraca liczbę śmierci wyspy.
#               %oneblock_island_creation_date% - Zwraca datę stworzenia wyspy.
#
#               %oneblock_currency_money% - Zwraca balans gracza w walucie money.
#               %oneblock_activity_points% - Zwraca punkty aktywności gracza.
#
#               %player_name% - Zwraca nazwę gracza.
#               %player_status% - Zwraca status gracza (online/offline).
#               %oneblock_player_kills% - Zwraca liczbę zabójstw gracza.
#               %oneblock_player_deaths% - Zwraca liczbę śmierci gracza.
#               %oneblock_player_last_seen% - Zwraca czas od ostatniej aktywności gracza (np. 23 min temu, 3h temu, 1d temu).
#               %oneblock_player_first_join% - Zwraca datę pierwszego dołączenia gracza.
#
# Plik językowy, którego będą używać wszystkie wiadomości pluginu.
lang: "PL.yml"
# Sekcja konfiguracji dotycząca komend.
# Komendy związane z oneblockiem.
oneblock:
  # Sekcja dotycząca głównych ustawień oneblocka.
  general:
    # Świat, w którym będą tworzone wyspy (oneblocki).
    creation-worlds:
    - island
    # Odległość w blokach, w której wyspy będą od siebie oddalone.
    islands-distance: 1000
  # Sekcja dotycząca głównej komendy oneblocka.
  commands:
    # Główna komenda oneblocka.
    main-command: "Oneblock"
    # Lista aliasów głównej komendy.
    aliases:
    - island
    - is
    - wyspa
    - ob
  # System punktów aktywności kraju
  # Punkty są wykorzystywane do tworzenia rankingu krajów.
  #
  # Ustaw 0, aby wyłączyć przyznawanie punktów za daną aktywność.
  activity-points:
    # Za godzinę aktywnej gry.
    playtime-hour: 5
    # Za zabicie moba.
    mob-kill: 1
    # Za zabicie gracza poza wojną.
    player-kill: 5
    # Za śmierć gracza.
    player-death: -2
    # Za pokonanie bossa.
    boss-kill: 50
    # Za udział w wojnie.
    war-participation: 50
    # Za wygraną wojnę.
    war-win: 250
    # Za przegraną wojnę.
    war-lose: 75
    # Za remis.
    war-draw: 125
    # Za zabicie gracza podczas wojny.
    war-player-kill: 10
    # Za śmierć podczas wojny.
    war-player-death: -2
    # Za przejęcie punktu kontrolnego.
    war-capture-point: 30
    # Za obronę punktu kontrolnego.
    war-defend-point: 20
    # Za przejęcie flagi.
    war-capture-flag: 50
    # Za obronę flagi.
    war-defend-flag: 25
    # Za zniszczenie celu wojennego.
    war-objective-destroy: 75
   # Za wykonanie celu wojennego.
    war-objective-complete: 40
  # Główne menu oneblocka.
  main-menu:
    inventory-type: CHEST
    menu-title: "&6&lMenu oneblocka"
    size: 54
    items:
      countries:
        name: "&6Kraje"
        slot: 0
        material: "%animation_country_change%"
        lore:
        - "&fOtwiera menu krajów"
        file: ""
        actions:
          commands:
          - dm open kraje %player_name %
      filler:
        material: GRAY_STAINED_GLASS_PANE
        name: ""
        slots: 1-2,6-7,9,17,36,44,46-48,50-53
      # Pokazuje, w jaki sposób mają być wyświetlani nowo dodani gracze.
      player-sorting:
        material: "%player_head%"
        name: "[&a%player_status%] &e%player_name%"
        slots: 10-16,19-25,28-34,37-43
        lore:
        - "&7Ranga: &9%oneblock_island_rank%"
        - "&7Stan konta: &a$%oneblock_currency_money%"
        - "&7Wkład: &5%oneblock_activity_points%"
        - ""
        - "&7K/D: &c%oneblock_player_kills%&7/&7%oneblock_player_deaths%"
        - ""
        - "&7Ostatnio widziany: &a%oneblock_player_last_seen%"
        - "&7Dołączył: &a%oneblock_island_player_first_join%"

      information:
        material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMzU3NDcwMTBkODRhYTU2NDgzYjc1ZjYyNDNkOTRmMzRjNTM0NjAzNTg0YjJjYzY4YTQ1YmYzNjU4NDAxMDVmZCJ9fX0="
        name: "&b&lInformacje"
        slot: 3
        lore:
        - ""
        - "&7Nazwa wyspy: &6%oneblock_island_name%"
        - "&7Wybrany kraj: &6%oneblock_island_country%"
        - ""
        - "&7Ranga: &9%oneblock_island_rank%"
        - ""
        - "&7Poziom: &b%oneblock_current_island_level%"
        - "&7Pozostałe bloki: &e%oneblock_blocks_required_for_level%"
        - "&7Progres: &a%oneblock_blocks_required_for_level_percentage%%"
        - ""
        - "&7Łączny balans: &a$%oneblock_island_currency_money%"
        - "&7Łączny wkład: &5%oneblock_island_activity_points%"
        - ""
        - "&7K/D wyspy: &c%oneblock_island_kills%&7/&7%oneblock_island_deaths%"
        - ""
        - "&7Data stworzenia: &b%oneblock_island_creation_date%"
      ranking-wyspy:
        material: ARMOR_STAND
        name: "&e&lRanking wysp"
        slot: 4
        file: oneblock/leaderboards.yml
        lore:
        - "&fKliknij, aby otworzyć listę liderów wysp"
      info-punkty:
        material: AMETHYST_SHARD
        name: "&5&lInformacje o punktach aktywności"
        slot: 5
        lore:
        - ""
        - "&5Czym są punkty aktywności?"
        - "&fPunkty aktywności to pewien rodzaj waluty"
        - "&fprzyznawany każdemu graczowi wyspy"
        - "&fza ukończenie poszczególnych zadań"
        - "&fpunkty określają jak wysoko znajduje się wyspa."
        - "&fw rankingu, a dzięki wysokiej pozycji, wszyscy gracze są nagradzani."
        - ""
        - "&5Jak zdobywać punkty aktywności?"
        - "&fPunkty aktywności możesz zdobywać:"
        - "&f- zabijając moby i graczy"
        - "&f- pokonując bossa i grając na serwerze"
        - "&f- uczestnicząc w wojnie krajów"
        - "&f- oraz wykonując różne zadania podczas wojny"
      upgrades:
        material: hdb-8786
        name: "&6&lUlepszenia"
        slot: 8
        lore: "&fKliknij, aby otworzyć menu ulepszeń"
        file: GUIs/oneblock/upgrades.yml
        # Warunek otworzenia menu.
        open-requirement:
          requirement-placeholder: '%oneblock_current_island_level%'
          requirement-operator: '>='
          min-island-level: 15
      misje:
        material: WRITABLE_BOOK
        name: "&6&lMisje"
        slot: 18
        lore:
        - "&fKliknij, aby otworzyć menu misji"
        file: GUIs/oneblock/quests/quests_menu.yml
        open-requirements:
          requirement-placeholder: '%oneblock_current_island_level%'
          requirement-operator: '>='
          min-island-level: 5
      sklep:
        material: hdb-50244
        name: "&e&lSklep"
        slot: 26
        lore:
        - "&fKliknij, aby otworzyć menu sklepu"
        file: GUIs/oneblock/shop.yml
      boss:
        material: ZOMBIE_HEAD
        name: "&9&lBoss"
        slot: 27
        lore:
        - "&fKliknij, aby otworzyć menu bossa"
        file: GUIs/oneblock/boss.yml
      warpy:
        material: COMPASS
        name: "&6&lWarpy"
        slot: 35
        lore:
        - "&fKliknij, aby otworzyć menu warpów"
        actions:
          commands:
          - dm open warpy %player_name%
      settings:
        material: CLOCK
        name: "&7Ustawienia"
        slot: 45
        lore:
        - "&fKliknij, aby otworzyć ustawienia wyspy"
        file: GUIs/oneblock/settings.yml
      # Zamyka menu wyspy
      close:
        material: BARRIER
        name: "&c&lZamknij"
        slot: 49


  # Sekcja dotycząca wyglądu wielu funkcji.
  display:
    # Ustawienia dotyczące poradnikowego hologramu.
    tut-hologram:
      enabled: true
      # Sposób, w jaki zostanie utworzony hologram.
      # Wspierane opcje to:
      # Decent holograms — hologram jest tworzony za pomocą pluginu decent holograms.
      # selfmaking — hologram jest tworzony przez plugin samodzielnie.
      # Automatic — plugin sam wybiera lepszą opcję, w wypadku, gdyby np. nie udało mu się stworzyć hologramu z użyciem decent holograms.
      hologram-creation: Decentholograms
      # Możesz tutaj ustawić, na ile czasu chcesz, aby był wyświetlany hologram.
      # -1 oznacza nieskończoność lub dopóki gracz sam nie wyłączy w ustawieniach.
      display-time: -1
      lore:
      - '                   &fWitaj na swojej wyspie &b%player%&f!'
      - '&fKop zaznaczony blok, aby zwiększać poziom wyspy i otrzymywać lepsze surowce'
      - '&fPowiększaj swoją wyspę i ulepszaj jej perki, aby zwiększać ograniczenia wyspy.'
      - '&fSprzedawaj bloki i surowce, aby zarabiać pieniądze i kupować potrzebne przedmioty z &e/sklep'
      - '&fDobuduj się do osadnika, aby odblokować &2misje wyspy &fi rozwijać bonusy wybranego kraju'
      - '&fZdobywaj klucze z misji, by otwierać kraty na &e/spawn i zdobywać ekskluzywne przedmioty'
      - '                   &7Możesz wyłączyć ten hologram w &b/ustawienia.'
      # Oś Y, na której będzie znajdował się armor stand z hologramem.
      height: 1
      # Dystans w blokach definiujący jak daleko ma się pojawić hologram od głównego bloku wyspy.
      distance: 4
    # Ustawienia dotyczące głównego bloku wyspy.
    main-block:
      # Sposób zaznaczenia głównego bloku.
      # Wspieranymi opcjami są glowing oraz none
      display-type: glowing
      # Za ile sekund powinien pojawiać się następny blok?
      # -1 oznacza, że plugin będzie respił bloki najszybciej jak może.
      min-block-respawn-time: -1
      # Ustaw, w jakiej odległości od gracza ma się pojawić mob.
      mob-spawn-distance: 2
      # Po włączeniu tej funkcji plugin będzie automatycznie kontrolował wysokość spawnowania mobów.
      mobs-height-control: true
      # Określa, na jakiej wysokości różnej od gracza mob ma się spawnić.
      # Dla przykładu, jeśli wpisałeś tu jeden, mob zrespi się 1 blok wyżej niż ty, aby nie wypadł poza mapę.
      # Działa tylko, gdy funkcja mobs-height-control jest włączona.
      mob-player-spawn-height-difference: 1
      # Szansa spawnowania mobu na pojedynczym respieniu bloku.
      # Wartość od 0.0 do 1.0 lub od 1 do 100 (będzie automatycznie konwertowana).
      # 0.10 = 10% szansy na respawn mobu przy każdym kopaniu bloku.
      # Zwiększ wartość dla częstszych mobów, zmniejsz dla rzadszych.
      mob-spawn-chance: 0.07
    money-display:
      format: "&a$%oneblock_currency_money%"
      height: 2.35
      update-interval-ticks: 5
    # Sekcja dotycząca formatu leveli.
    levels:
      # Możesz to wybrać, w jaki sposób chcesz, aby wyświetlał się postęp wyspy.
      # Wspierane opcje to bossbar i placeholder.
      placeholders:
        # Nazwa placeholdera, który będzie stworzony przez plugin.
        # Plugin połączy prefix, input i suffix i stworzy z tego jeden placeholder, który np. tutaj będzie wyglądał tak %oneblock_bar_progress%
        bar-progress:
          # Treść, jaka ma się znaleźć przed placeholderem.
          # Spacja przed domknięciem cudzysłowu oznacza spację w tym miejscu w placeholderze.
          prefix: '&8[&a'
          # Główna treść placeholdera.
          input: '%progress_bar%'
          # Pole określające co powinno się pojawić w miejsce placeholdera %progress_bar% w niejasnym przypadku.
          # Tak powinien wyglądać pasek postępu, ma się on też aktualizować najlepiej gdzieś co sekundę lub szybciej.
          value: '&a██████████████&7██████'
          # Treść po placeholderze.
          suffix: '&8]'
    # Sekcja ustawień dotycząca warpów
    warps:
      # Część dotycząca ustawień warpów serwerowych
      server-warps:
        # Czas w sekundach pomiędzy teleportami.
        cooldown: 15
        # Czas w sekundach, który będzie odliczany do teleportu.
        warm-up: 5
        # Sposób, w jaki będzie wyświetlane odliczanie do teleportacji.
        # Wspierane opcje to: title, subtitle, message, actionbar oraz bossbar.
        message-format: title
      # Część dotycząca ustawień warpów ustawionych przez graczy.
      player-warps:
        cooldown: 60
        warm-up: 5
        message-format: title
    # Sekcja ustawień dotycząca krajów.
    countries:
      # Sekcja dotycząca ustawień krajów.
      settings:
        # placeholder używany do sprawdzenia wymagania
        requirement-placeholder: '%oneblock_current_island_level%'
        requirement-operator: '>='
        min-island-level: 10
        # Czas pomiędzy następnymi zmianami kraju.
        switch-cooldown: 24
      # Opisuje, jak ma wyglądać menu potwierdzenia kraju.
      menu:
        menu-title: "&fPotwierdź wybór kraju"
        size: 27
        items:
          potwierdzenie:
            display_name: "&a&lPotwierdź"
            slot: 11
            material: LIME_STAINED_GLASS_PANE
            lore:
            - "&fKliknij, aby potwierdzić wybór kraju"
            # Wspieranymi akcjami są:
            # CONFIRM — potwierdza wybór kraju i zakłada jego buffy i nerfy na wyspę gracza.
            # CANCEL — anuluje, wybór kraju wraca, wraca do menu krajów komendą /ob kraje.
            action: CONFIRM
          item_kraju:
            display_name: "&f%country_name%"
            slot: 13
            # Materiał pobierany z pola material w countries.yml.
            material: "%country_material%"
            lore:
              - '&7&m-----------------------------'
              - '&6✦ Bonusy:'
              - '  &a✔ &f%country_buff_1%'
              - '  &a✔ &f%country_buff_2%'
              - '  &a✔ &f%country_buff_3%'
              - '&7&m-----------------------------'
              - '&c✘ Nerf: &f%country_nerf%'
              - '&7&m-----------------------------'
              - '&eCzy na pewno chcesz wybrać ten kraj?'
              - '&cUwaga: wyboru nie można cofnąć!'
          anuluj:
            display_name: "&c&lAnuluj"
            slot: 15
            material: RED_STAINED_GLASS_PANE
            lore:
            - "&fKliknij, aby wrócić do menu krajów."
    # Sekcja dotycząca animacji itemów.
    animations:
      # Nazwa animacji, używana w placeholderze %animation_(animation_name)%
      country_change:
        # Rodzaj animacji, wspieranymi opcjami są:
        # block_change - zmienia materiał na danym slocie, co określony przedział czasu, z listy wypisanych przedmiotów.
        animation-type: "block_change"
        # Czas, po którym każdy kolejny materiał ma być zmieniony na kolejny w sekundach.
        one-material-duration: 1.0
        # Lista materiałów, które będą wyświetlane w danym slocie podczas animacji.
        material-list:
          country1:
            material: basehead-eyJ0ZXh0dXJlcyI6IHsiU0tJTiI6IHsidXJsIjogImh0dHBzOi8vdGV4dHVyZXMubWluZWNyYWZ0Lm5ldC90ZXh0dXJlLzU3Y2VhNzc2NzMzMGRkNDk0M2Q0NzQ5NmI1MTg2YzE3ZTYxODg4YTI5ZmJhNjUxYTIzZGFlNzVmNjUwYjUzMmMifX19
          country2:
            material: basehead-eyJ0ZXh0dXJlcyI6IHsiU0tJTiI6IHsidXJsIjogImh0dHBzOi8vdGV4dHVyZXMubWluZWNyYWZ0Lm5ldC90ZXh0dXJlL2E0YmU3NTlhOWNmN2YwYTE5YTdlOGU2MmYyMzc4OWFkMWQyMWNlYmFlMzhhZjlkOTU0MTY3NmEzZGIwMDE1NzIifX19
          country3:
            material: basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZjZkMDMzZGM1ZjY3NWFkNTFiYzA2YzdhMTk0OWMzNWExZDM3ZTQ4YTJlMWMyNzg5YzJjZjdkMzBlYzU4ZjMyYyJ9fX0=
          country4:
            material: basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvM2JhNTg2YTZmMDdhMDk5YTU4ODM4YTlmYmVkODQ1ZWNmNzgwZmMyYTM5MGY3YTQ2MjBhN2RjZjBhODVlNzVhNCJ9fX0=
          country5:
            material: basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvM2Q1ZWU2NzEyN2ZlZWM0ODM0NmRhYmE4ODRhZGM5M2Q2ZmEzYThkM2QwZjBlODRmYWNhYWJiZGNhOTdhYTdmZiJ9fX0=
          country6:
            material: basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNDU5NTU4N2Q3NDVhMTc0Y2QyMGYxYWY1MjMzZTQ2YTQyNDk0MzdmMzlkMTZlNDY2ZmQzZTNmODIyODY3ZDE4OSJ9fX0=
          country7:
