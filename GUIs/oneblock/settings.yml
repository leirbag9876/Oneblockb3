  size: 54

filler:
  material: GRAY_STAINED_GLASS_PANE
  name: " "
  slots:
    - "all"

layout:
  divider: "&8&m------------------------"
  role-header: "&7Minimalna ranga:"

roles:
  selected-format: "&e-> %role_display%"
  unselected-format: "&7   %role_display%"
  display-names:
    OWNER: "Właściciel"
    ADMIN: "Administrator"
    HELPER: "Helper"
    MEMBER: "Członek"
    VISITOR: "Gość"

controls:
  - "&eLPM &7- podnieś wymaganą rangę"
  - "&ePPM &7- obniż wymaganą rangę"

sounds:
